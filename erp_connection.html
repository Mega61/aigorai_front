<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Aigorai</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='chatbot_agorai_style.css'>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="chatbot_agorai_sides_server.js" type="text/javascript"></script>
</head>

<body>
    <div class="erp-con">
        <div class="container">
            <div class="logo_container_erp">
                <img src="https://github.com/Mega61/sample_web_app/blob/master/get%20your%20key%20to%20unlock%20value%20(11).png?raw=true"
                    alt="Aigorai Logo">
            </div>
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="m9 12 2 2 4-4"></path>
            </svg>
            <h1 class="erp_title">Order Received</h1>
            <p class="erp_description">Thank you for your order! Your order #12345 has been received and is being processed.</p>
            <div class="grid">
                <div class="grid-item">
                    <div>Order Number:</div>
                    <div class="font-medium">#12345</div>
                </div>
                <div class="grid-item">
                    <div>Estimated Delivery:</div>
                    <div class="font-medium">July 15, 2024</div>
                </div>
            </div>
            <a href="https://procurement-agorai.myshopify.com/collections/all" class="button">Return to Homepage</a>
        </div>
    </div>
</body>

</html>
